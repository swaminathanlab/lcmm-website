pi:
  - id: vinay-swaminathan
    name: Vinay Swaminathan
    role: Group leader · Associate Professor · WCMM Fellow
    pubmed_name: Swaminathan V
    bio: |
      Vinay trained as a mechanical engineer before moving into biology. He did his PhD
      in physics on cell mechanics with Richard Superfine at UNC Chapel Hill, and his
      postdoc with Clare Waterman at the NIH, working on how integrins and focal adhesions
      sense mechanical cues. He started the lab at Lund University in 2018.
    links:
      orcid: 0000-0002-9946-810X
      email: vinay.swaminathan@med.lu.se

