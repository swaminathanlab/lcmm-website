name: Laboratory of Cell and Molecular Mechanobiology
short_name: LCMM
pi: Vinay Swaminathan
# Big home-page headline. Words between *asterisks* are set in italic accent colour.
headline: How cells *sense and remember* their physical world
tagline: We study how the physical properties of the extracellular matrix shape cell fate, mechanical memory and cancer invasion.

intro: |
  We study how cells read the mechanical and physical properties of their surroundings,
  how those signals are stored as lasting cellular states, and how this goes wrong in cancer.
  We combine engineered 3D matrices, quantitative and polarization microscopy, microfluidics
  and physical modelling with cell and molecular biology.

